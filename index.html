<!DOCTYPE html>

    <title>ToolSub24 - Free Online Utility Tools</title>
    <style>

        .tool-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .card-icon { font-size: 36px; margin-bottom: 12px; }
        .tool-card h3 { color: #2c3e50; font-size: 18px; margin-bottom: 8px; }
        .tool-card p { color: #666; font-size: 14px; line-height: 1.4; }
        footer { text-align: center; margin-top: 40px; color: #95a5a6; font-size: 13px; }
    </style>
</head>

<div class="container">
