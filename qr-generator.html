
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Search</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #202124;
}

.top {
    text-align: right;
    padding: 20px;
    font-size: 14px;
}

.top a {
    margin-left: 20px;
    text-decoration: none;
    color: #333;
}

.main {
    text-align: center;
    margin-top: 100px;
    padding: 15px;
}

.logo {
    font-size: 55px;
    font-weight: bold;
    margin-bottom: 30px;
}

.logo span:nth-child(1) { color: #4285f4; }
.logo span:nth-child(2) { color: #ea4335; }
.logo span:nth-child(3) { color: #fbbc05; }
.logo span:nth-child(4) { color: #4285f4; }
.logo span:nth-child(5) { color: #34a853; }
.logo span:nth-child(6) { color: #ea4335; }

.search {
    max-width: 600px;
    margin: auto;
    display: flex;
    align-items: center;
    border: 1px solid #dfe1e5;
    border-radius: 30px;
    padding: 10px 18px;
    box-shadow: 0 1px 5px #ddd;
}

.search:hover {
    box-shadow: 0 2px 8px #ccc;
}

.search input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 17px;
    padding: 8px;
    min-width: 0;
}

.search button {
    border: none;
    background: #4285f4;
    color: white;
    padding: 10px 16px;
    border-radius: 22px;
    cursor: pointer;
}

.buttons {
    margin-top: 25px;
}

.buttons button {
    background: #f8f9fa;
    border: 1px solid #f8f9fa;
    padding: 12px 18px;
    margin: 5px;
    border-radius: 5px;
    cursor: pointer;
}

.buttons button:hover {
    border: 1px solid #dadce0;
}

#result {
    max-width: 700px;
    margin: 35px auto;
    padding: 20px;
    text-align: left;
    white-space: pre-wrap;
    line-height: 1.7;
}

.footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #f2f2f2;
    padding: 15px;
    color: #666;
    font-size: 13px;
}

@media(max-width:600px) {
    .main {
        margin-top: 90px;
    }

    .logo {
        font-size: 43px;
    }

    .search {
        padding: 8px;
    }

    .search input {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="top">
    <a href="#">About</a>
    <a href="#">AI</a>
</div>

<div class="main">

    <div class="logo">
        <span>M</span><span>y</span><span>A</span><span>I</span><span> </span><span>+</span>
    </div>

    <p>Ask anything. Discover more.</p>

    <div class="search">
        <input id="question"
        type="text"
        placeholder="Ask your AI anything..."
        onkeydown="if(event.key==='Enter')askAI()">

        <button onclick="askAI()">Search</button>
    </div>

    <div class="buttons">
        <button onclick="askAI()">AI Search</button>
        <button onclick="clearSearch()">Clear</button>
    </div>

</div>

<div id="result"></div>

<div class="footer">
    India | MyAI Search
</div>

<script>
async function askAI() {

    let question = document.getElementById("question").value;

    if(!question.trim()) {
        alert("Please enter your question");
        return;
    }

    document.getElementById("result").innerText =
    "AI is thinking...";

    // येथे पुढे खरे AI API जोडायचे आहे

    setTimeout(() => {
        document.getElementById("result").innerText =
        "Your question: " + question +
        "\n\nAI API जोडल्यावर येथे खरे AI उत्तर दिसेल.";
    }, 1000);
}

function clearSearch() {
    document.getElementById("question").value = "";
    document.getElementById("result").innerText = "";
}
</script>

</body>
</html>
