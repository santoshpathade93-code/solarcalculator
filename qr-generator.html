<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free QR Code Generator - ToolSub24</title>
    <meta name="description" content="Konthyahi text kiva link sathi jhatpat QR Code tayar kara. Free online QR code generator tool on ToolSub24.">
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="2Kb5-_5xxYngM6HFfxAzOktu6MxBDiQZTixLXa91ZCE" />
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; line-height: 1.6; }
        .header { background: #0f172a; color: white; padding: 20px; text-align: center; }
        .header a { color: #f97316; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
        .container { max-width: 500px; margin: 30px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h2 { font-size: 22px; margin-bottom: 20px; color: #0f172a; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #334155; }
        input[type="text"] { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
        input[type="text"]:focus { border-color: #f97316; }
        button { width: 100%; background: #f97316; color: white; border: none; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #ea580c; }
        #qrcode { margin-top: 25px; display: flex; justify-content: center; }
        footer { text-align: center; margin-top: 40px; padding: 20px; color: #64748b; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html">← Back to Home Directory</a>
        <h1>ToolSub24 Utility</h1>
    </div>

    <div class="container">
        <h2>📱 QR Code Generator</h2>
        <div class="form-group">
            <label for="textInput">Website Link kiva Text Yithe Taka:</label>
            <input type="text" id="textInput" placeholder="Udas. https://toolsub24.in">
        </div>
        <button onclick="generateQR()">QR Code Banva</button>
        
        <div id="qrcode"></div>
    </div>

    <footer>
        <p>&copy; 2026 ToolSub24.in — All Rights Reserved.</p>
    </footer>

    <script>
        function generateQR() {
            let qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";
            let textValue = document.getElementById("textInput").value;
            
            if(textValue.trim() === "") {
                alert("Krupaya kahi tari text kiva link taka!");
                return;
            }

            new QRCode(qrContainer, {
                text: textValue,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }
    </script>
</body>
</html>
